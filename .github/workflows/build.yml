    name: Build Scale UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Find Scale UI ZIP
        shell: bash
        run: |
          set -e

          ZIP_COUNT=$(find . -maxdepth 2 \
            -type f \
            -name 'scaleui_*.zip' \
            -not -path './.git/*' | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "ERROR: No scaleui_*.zip found."
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "ERROR: More than one Scale UI ZIP found:"
            find . -maxdepth 2 \
              -type f \
              -name 'scaleui_*.zip' \
              -not -path './.git/*'
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 2 \
            -type f \
            -name 'scaleui_*.zip' \
            -not -path './.git/*' | head -n 1)

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Scale UI project
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 2 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "build-src/settings.gradle.kts" ] || \
             [ -f "build-src/settings.gradle" ]; then
            PROJECT_DIR="build-src"

          else
            PROJECT_DIR=$(find build-src -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Gradle project not found after extraction."
              find build-src -maxdepth 4 -type f | head -200
              exit 1
            fi
          fi

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Project files:"
          ls -la

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/ScaleUI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-debug
          path: output/ScaleUI-debug.apk
          if-no-files-found: error  
