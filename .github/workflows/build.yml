name: Build Scale UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Find and extract Scale UI ZIP
        shell: bash
        run: |
          set -e

          mkdir -p build-src

          mapfile -t ZIPS < <(
            find . -maxdepth 2 -type f \
              -iname "*.zip" \
              ! -path "./.git/*"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"
          echo "Using source ZIP: $ZIP"

          unzip -q "$ZIP" -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$(find "$GITHUB_WORKSPACE/build-src" \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle project root not found."
            find "$GITHUB_WORKSPACE/build-src" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle project: $ROOT"

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          echo "Android project validation passed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          mapfile -t APKS < <(
            find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Generated APK(s):"
          printf '%s\n' "${APKS[@]}"

          mkdir -p release-apk
          cp "${APKS[0]}" release-apk/ScaleUI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-APK
          path: release-apk/ScaleUI-debug.apk
          if-no-files-found: error
